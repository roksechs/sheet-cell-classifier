[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-cell-classifier"
version = "0.1.0"
description = "Cell role classifier training pipeline for sheet-call-tree"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.5",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.8",
]
